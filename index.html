<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberCode Rush & Miner - Pro Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #030712; color: #f3f4f6; }
        .font-cyber { font-family: 'Orbitron', sans-serif; }
        .neon-glow { text-shadow: 0 0 10px rgba(16, 185, 129, 0.7), 0 0 20px rgba(16, 185, 129, 0.5); }
        .neon-box { box-shadow: 0 0 25px rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden">
    <header class="w-full border-b border-emerald-900/50 bg-slate-950/80 backdrop-blur sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500 flex items-center justify-center font-cyber font-bold text-emerald-400 text-xl">CC</div>
            <div>
                <h1 class="font-cyber font-black text-lg tracking-wider text-emerald-400 neon-glow">CYBERCODE RUSH</h1>
                <p class="text-xs text-slate-400">Pro Monétisation Edition</p>
            </div>
        </div>
        <div class="flex items-center space-x-6">
            <div class="bg-slate-900 border border-emerald-500/30 px-4 py-2 rounded-xl text-right">
                <div class="text-xs text-slate-400 uppercase font-cyber">Solde Crypto</div>
                <div id="balance" class="font-cyber font-bold text-emerald-400 text-lg">0.000000 BTC</div>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="lg:col-span-2 flex flex-col space-y-6">
            <div class="neon-box bg-slate-900/90 rounded-2xl p-6 relative flex flex-col items-center justify-center min-h-[400px]">
                <div class="absolute top-4 left-4 text-xs font-cyber text-emerald-500/80">NODE MINING ACTIVE</div>
                <div id="clicker-target" class="w-48 h-48 rounded-full bg-gradient-to-br from-emerald-600 to-teal-900 flex flex-col items-center justify-center cursor-pointer transform transition active:scale-95 shadow-2xl border-4 border-emerald-400/50 hover:border-emerald-400">
                    <span class="font-cyber font-black text-2xl text-white">MINE</span>
                    <span class="text-xs text-emerald-200 mt-1">+1 CLIC</span>
                </div>
                <p class="mt-8 text-sm text-slate-400 text-center">Clique pour miner des blocs, accumuler des cryptos virtuelles et débloquer des upgrades automatiques professionnels !</p>
            </div>
        </div>

        <div class="neon-box bg-slate-900/90 rounded-2xl p-6 flex flex-col space-y-4">
            <h2 class="font-cyber font-bold text-emerald-400 border-b border-emerald-900/50 pb-3">BOUTIQUE & UPGRADES</h2>
            <div id="upgrades-list" class="flex flex-col space-y-3">
                <button onclick="buyUpgrade('rig', 15)" class="w-full bg-slate-800 hover:bg-slate-700 border border-emerald-500/30 p-3 rounded-xl flex justify-between items-center transition">
                    <div class="text-left">
                        <div class="font-semibold text-sm">Rig de Minage ASIC</div>
                        <div class="text-xs text-emerald-400">+0.5 / sec (Coût: <span id="cost-rig">15</span>)</div>
                    </div>
                    <span id="count-rig" class="font-cyber font-bold bg-emerald-500/10 px-3 py-1 rounded-lg border border-emerald-500/30">0</span>
                </button>
                <button onclick="buyUpgrade('ai', 100)" class="w-full bg-slate-800 hover:bg-slate-700 border border-emerald-500/30 p-3 rounded-xl flex justify-between items-center transition">
                    <div class="text-left">
                        <div class="font-semibold text-sm">Cluster IA Autonome</div>
                        <div class="text-xs text-emerald-400">+3.0 / sec (Coût: <span id="cost-ai">100</span>)</div>
                    </div>
                    <span id="count-ai" class="font-cyber font-bold bg-emerald-500/10 px-3 py-1 rounded-lg border border-emerald-500/30">0</span>
                </button>
            </div>
            <div class="mt-auto pt-4 border-t border-emerald-900/50">
                <button onclick="claimReward()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-slate-950 font-cyber font-bold py-3 rounded-xl transition shadow-lg">RETIRER LES GAINS (ADS)</button>
            </div>
        </div>
    </main>

    <script>
        let balance = 0;
        let cpss = 0;
        let upgrades = { rig: { count: 0, cost: 15, power: 0.5 }, ai: { count: 0, cost: 100, power: 3.0 } };

        const balanceEl = document.getElementById('balance');
        const target = document.getElementById('clicker-target');

        target.addEventListener('click', () => {
            balance += 1;
            updateDisplay();
            createFloatingText('+1');
        });

        function buyUpgrade(type, baseCost) {
            let up = upgrades[type];
            if (balance >= up.cost) {
                balance -= up.cost;
                up.count += 1;
                cpss += up.power;
                up.cost = Math.floor(up.cost * 1.15);
                document.getElementById('cost-' + type).innerText = up.cost;
                document.getElementById('count-' + type).innerText = up.count;
                updateDisplay();
            }
        }

        function createFloatingText(text) {
            const el = document.createElement('div');
            el.innerText = text;
            el.className = 'absolute font-cyber font-bold text-emerald-400 pointer-events-none transition-all duration-700';
            el.style.left = (Math.random() * 100 + 50) + 'px';
            el.style.top = '100px';
            target.parentElement.appendChild(el);
            setTimeout(() => { el.style.transform = 'translateY(-60px)'; el.style.opacity = '0'; }, 50);
            setTimeout(() => el.remove(), 750);
        }

        function claimReward() {
            alert('Connexion au portefeuille Web3 ou affichage de l\'annonce publicitaire monétisée en cours... Gains validés !');
        }

        function updateDisplay() {
            balanceEl.innerText = balance.toFixed(2) + ' BTC';
        }

        setInterval(() => {
            if (cpss > 0) {
                balance += cpss / 10;
                updateDisplay();
            }
        }, 100);
    </script>
</body>
</html>
